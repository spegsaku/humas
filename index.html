<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI News Generator - Spegsaku Juara</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --navy: #1a237e;
            --gold: #fbc02d;
            --light-bg: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light-bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo-container img {
            height: 100px;
            width: auto;
        }

        h1 {
            font-family: 'Merriweather', serif;
            color: var(--navy);
            font-size: 28px;
            margin: 0 0 10px 0;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .section-label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: var(--navy);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 25px;
        }

        input[type="password"], textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            box-sizing: border-box;
            transition: border 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--navy);
        }

        /* File Upload Area */
        .file-drop-area {
            border: 2px dashed #cbd5e1;
            padding: 30px;
            text-align: center;
            border-radius: 12px;
            background: #f1f5f9;
            cursor: pointer;
            transition: 0.3s;
        }

        .file-drop-area:hover {
            background: #e2e8f0;
            border-color: var(--navy);
        }

        .file-drop-area p {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .btn-primary {
            background: var(--navy);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: #0d144d;
            box-shadow: 0 4px 12px rgba(26, 35, 126, 0.2);
        }

        .btn-primary:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        /* Result Area */
        #resultArea {
            display: none;
            margin-top: 40px;
            border-top: 2px solid #f1f5f9;
            padding-top: 30px;
        }

        #output {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 30px;
            border-radius: 8px;
            line-height: 1.8;
            font-family: 'Merriweather', serif;
            font-size: 16px;
            text-align: justify;
            white-space: pre-wrap;
        }

        .action-bar {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-secondary {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            font-weight: 500;
            color: var(--navy);
        }

        footer {
            margin-top: auto;
            text-align: center;
            padding: 30px;
            font-size: 13px;
            color: var(--text-muted);
            background: #fff;
            border-top: 1px solid #e2e8f0;
        }

        footer a {
            color: var(--navy);
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .container { margin: 10px; padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-container">
            <img src="http://googleusercontent.com/image_collection/image_retrieval/12815142602683500655" alt="Logo YPLP PGRI Jawa Tengah">
        </div>
        <h1>Studio Rilis Berita Humas</h1>
        <div class="subtitle">Platform Jurnalistik Digital spegsakujuara.blogspot.com</div>
    </header>

    <div class="input-group">
        <label class="section-label">Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="Masukkan API Key Anda...">
    </div>

    <div class="input-group">
        <label class="section-label">Bahan Berita (PDF, Docx, atau Teks)</label>
        <div class="file-drop-area" onclick="document.getElementById('fileInput').click()">
            <p id="fileStatus">Klik untuk unggah file atau tarik ke sini</p>
            <input type="file" id="fileInput" hidden accept=".txt,.pdf,.docx,.doc">
        </div>
    </div>

    <div class="input-group">
        <label class="section-label">Atau Masukkan Teks Secara Manual</label>
        <textarea id="manualText" rows="5" placeholder="Tuliskan poin-poin berita di sini..."></textarea>
    </div>

    <button id="generateBtn" class="btn-primary">Hasilkan Rilis Berita Resmi</button>

    <div class="loading" id="loader">
        <div style="margin-bottom:10px">Menyusun narasi jurnalistik...</div>
        <small>Menggunakan Kecerdasan Buatan Gemini AI</small>
    </div>

    <div id="resultArea">
        <label class="section-label">Hasil Draft Press Release</label>
        <div id="output"></div>
        <div class="action-bar">
            <button class="btn-secondary" onclick="copyContent()">Salin Teks</button>
            <button class="btn-secondary" onclick="window.print()">Cetak PDF</button>
        </div>
    </div>
</div>

<footer>
    &copy; 2024 Spegsaku Juara. Dikembangkan oleh <a href="https://toer.my.id" target="_blank">Catur Pamungkas, S.Pd.,Gr.</a>
</footer>

<script>
    const fileInput = document.getElementById('fileInput');
    const fileStatus = document.getElementById('fileStatus');
    let extractedText = "";

    // Handler Pembacaan File
    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        fileStatus.innerText = `Memproses: ${file.name}...`;
        const ext = file.name.split('.').pop().toLowerCase();

        try {
            if (ext === 'docx' || ext === 'doc') {
                const arrayBuffer = await file.arrayBuffer();
                const result = await mammoth.extractRawText({arrayBuffer});
                extractedText = result.value;
            } 
            else if (ext === 'pdf') {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                let text = "";
                for(let i=1; i<=pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    text += content.items.map(item => item.str).join(" ") + "\n";
                }
                extractedText = text;
            } 
            else {
                extractedText = await file.text();
            }
            fileStatus.innerText = `Berhasil memuat: ${file.name}`;
            fileStatus.style.color = "green";
        } catch (err) {
            alert("Gagal membaca file: " + err.message);
            fileStatus.innerText = "Klik untuk unggah ulang";
        }
    });

    // Handler Eksekusi AI
    document.getElementById('generateBtn').addEventListener('click', async () => {
        const key = document.getElementById('apiKey').value;
        const manual = document.getElementById('manualText').value;
        const finalContent = extractedText || manual;

        if(!key) return alert("API Key wajib diisi!");
        if(!finalContent) return alert("Masukkan bahan berita terlebih dahulu!");

        const btn = document.getElementById('generateBtn');
        const loader = document.getElementById('loader');
        const resultArea = document.getElementById('resultArea');

        btn.disabled = true;
        loader.style.display = 'block';
        resultArea.style.display = 'none';

        const prompt = `
            Anda adalah staf Humas Jurnalistik profesional. Buatlah rilis berita (Press Release) resmi untuk blog: spegsakujuara.blogspot.com.
            
            KRITERIA TULISAN:
            1. Gunakan bahasa Indonesia baku sesuai KBBI dan EYD yang sempurna.
            2. Gaya bahasa: Membumi, menyentuh hati, namun tetap akademis dan berwibawa (Hindari istilah hiperbola/bombastis).
            3. Struktur: Headline Menarik, Dateline (LOKASI, TANGGAL), Lead Berita, Tubuh Berita, dan Penutup.
            4. WAJIB: Di akhir tulisan, sertakan statemen penguat pamungkas dari Kepala Sekolah, Bapak Edhi Purwanto, S.Pd., lengkap dengan kutipan (quotes) inspiratif yang relevan dengan isi berita.
            5. Bersihkan hasil dari tanda bintang (**) atau simbol markdown lainnya agar teks benar-benar bersih siap salin.

            BAHAN BERITA:
            ${finalContent}
        `;

        try {
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            const data = await resp.json();
            const text = data.candidates[0].content.parts[0].text;
            
            document.getElementById('output').innerText = text.replace(/\*/g, '');
            resultArea.style.display = 'block';
        } catch (err) {
            alert("Koneksi gagal: " + err.message);
        } finally {
            btn.disabled = false;
            loader.style.display = 'none';
        }
    });

    function copyContent() {
        const text = document.getElementById('output').innerText;
        navigator.clipboard.writeText(text).then(() => alert("Berita disalin ke clipboard!"));
    }

    // Inisialisasi PDF Worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';
</script>

</body>
</html>
